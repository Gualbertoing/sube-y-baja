
<!DOCTYPE html>
<html lang="es">

<link rel="icon" type="image/png" href="../imagenes/icono.png">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca de artículos | Sube y Baja</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            /* FONDO AZUL */
            background-color: #6388ff;
            background-image: url("../imagenes/fondoazul1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 48px;
            color: white;
            margin-bottom: 15px;
        }

        p {
            font-size: 22px;
            color: white;
            line-height: 1.5;
            max-width: 650px;
        }

        /* BOTÓN ROSA */

        .boton-volver {
            display: inline-block;
            margin-top: 30px;
            padding: 16px 30px;

            background-color: #ff316c;
            color: white;

            font-size: 18px;
            font-weight: bold;
            text-decoration: none;

            border-radius: 30px;

            transition: transform 0.3s ease;
        }

        .boton-volver:hover {
            transform: scale(1.07);
            background-color: #e91e63;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 18px;
            }
        }

    </style>

</head>

<body>

    <h1>Biblioteca de artículos</h1>

    <p>
        ¡Bienvenidos a nuestra biblioteca!

        Aquí encontrarás artículos, consejos y recursos
        educativos para acompañar el aprendizaje
        de niñas y niños.

        Próximamente tendremos nuevos contenidos.
    </p>

    <a href="../index.html#papas" class="boton-volver">
        ← Volver a Para papás
    </a>

</body>

</html>
